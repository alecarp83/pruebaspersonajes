<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de personaje 3D</title>
<link rel="stylesheet" href="/src/style.css"></head>
<body>
<header>
  <button data-view="persp">Perspectiva</button><button data-view="front">Frontal</button>
  <button data-view="side">Lateral</button><button data-view="top">Superior</button>
  <span class="sep"></span>
  <select id="mode"><option value="translate">Mover (W)</option><option value="rotate">Rotar (E)</option><option value="scale">Escalar (R)</option></select>
  <label><input type="checkbox" id="snap" checked> Snap</label>
  <label class="charOnly"><input type="checkbox" id="markers" checked> Sockets</label>
  <label class="charOnly"><input type="checkbox" id="ik"> IK manos</label>
  <span class="sep"></span>
  <button id="undo">Deshacer</button><button id="redo">Rehacer</button>
  <span class="sep"></span>
  <span class="charOnly" style="display:contents"><button id="export">Exportar JSON</button><button id="glb">Exportar GLB</button><button id="shot">Captura PNG</button><button id="import">Importar JSON</button>
  <label><input type="checkbox" id="onlyObj"> solo objetos</label>
  <label><input type="checkbox" id="useNorm"> posición normalizada</label>
  <button id="reset">Reiniciar</button></span>
  <span class="mapOnly" style="display:contents"><button id="mapExport" title="Descarga maps/&lt;id&gt;/&lt;id&gt;.html, .css y .js en un .zip">Exportar mapa (.zip)</button><a id="mapPlay" href="game.html" target="_blank" rel="noopener" style="color:#7fd0b0">Probar en Jugar →</a></span>
  <span class="sep"></span>
  <button id="mapMode" title="Crear mapas de prueba para el modo Jugar">Crear mapa</button><a href="game.html" style="color:#7fd0b0">Jugar →</a>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <aside><div class="charOnly"><h3>Objetos</h3><p class="hint">Arrastra al personaje, o toca para añadir al socket sugerido.</p><div id="libList"></div></div><div class="mapOnly" id="mapLib"></div></aside>
  <div id="view"><div id="tag"></div></div>
  <aside id="side"><div class="mapOnly" id="mapSide"></div><div class="charOnly">
    <h3>Preset</h3>
    <div class="row"><select id="presetSel"></select><button id="presetBtn">Aplicar</button></div>
    <h3>Cuerpo</h3>
    <div class="row"><select id="segSel"></select></div>
    <div class="row" id="symRow"><label class="chk"><input type="checkbox" id="sym" checked> Simétrico</label><select id="sideSel"><option value="L">Lado L (izq.)</option><option value="R">Lado R (der.)</option></select></div>
    <div class="row"><label>Largo</label><input type="range" id="segLen" min="0.03" max="0.8" step="0.005"><output id="segLenV"></output></div>
    <div class="row"><label>Ancho</label><input type="range" id="segWid" min="0.03" max="0.7" step="0.005"><output id="segWidV"></output></div>
    <div class="row"><label>Piel</label><input type="color" id="cPiel"><label>Base</label><input type="color" id="cBase"></div>
    <h3>Equipo</h3>
    <div id="gearBox"></div>
    <h3>Parte seleccionada</h3>
    <p class="hint" id="partHint">Haz clic sobre una parte del cuerpo para cambiar su textura.</p><div id="partBox" hidden></div>
    <h3>Pose</h3>
    <div class="row"><select id="jointSel"></select></div>
    <div id="poseRows"></div>
    <div class="row"><label class="chk"><input type="checkbox" id="symPose"> Pose simétrica (mover L mueve R)</label></div>
    <div class="row"><button id="copyLR">Copiar L → R</button><button id="copyRL">Copiar R → L</button></div>
    <div class="row"><button id="poseA">Pose A</button><button id="poseT">Pose T</button><button id="jointReset">Reiniciar articulación</button></div>
    <h3>Objeto seleccionado</h3>
    <div id="props"><p class="hint">Haz clic en un objeto del personaje.</p></div>
  </div></aside>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
